<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Nasza mapa świata – Adam & Natalia • 8 lat</title>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0d1a0f;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Courier New', monospace;
      overflow: hidden;
    }
    #game-container {
      border: 6px solid #3d5c3a;
      box-shadow: 0 0 40px rgba(80,140,70,0.35);
    }
    canvas { display: block; image-rendering: pixelated; }
  </style>
</head>
<body>
  <div id="game-container"></div>
  <script>
    const W = 960, H = 640;
    const TILE = 32;

    const LOCATIONS = [
      { id: 'school', name: 'Szkoła nr 28', mapX: 4, mapY: 8, unlocked: true, collected: false,
        title: 'Pierwsze spotkanie',
        text: 'Tu wszystko się zaczęło. Przy wejściu do Szkoły Podstawowej nr 28 przy ul. Solarza 12 w Rzeszowie. Jeden zwykły dzień, który na zawsze zmienił nasze życie.' },
      { id: 'grill', name: 'Grill', mapX: 12, mapY: 4, unlocked: true, collected: false,
        title: 'Grill 02-06-2025',
        text: 'Dym, śmiech, zapach kiełbasek i Twoje oczy w świetle zachodzącego słońca. Zwykły wieczór, który stał się wyjątkowy.' },
      { id: 'wakacje', name: 'Wakacje', mapX: 22, mapY: 6, unlocked: true, collected: false,
        title: 'Wakacje z Natką',
        text: 'Słońce, sól na skórze, wspólne zdjęcia i poczucie, że cały świat należy tylko do nas dwojga.' },
      { id: 'wesele', name: 'Wesele Sylwii', mapX: 9, mapY: 14, unlocked: true, collected: false,
        title: 'Wesele Sylwii',
        text: 'Tańczyliśmy, śmialiśmy się i patrzyliśmy na siebie tak, jakbyśmy byli jedynymi ludźmi na sali.' },
      { id: 'park', name: 'Park', mapX: 18, mapY: 12, unlocked: false, collected: false,
        title: 'Spacery w parku',
        text: 'Ileż to godzin spędziliśmy chodząc bocznymi alejkami, trzymając się za ręce i mówiąc o wszystkim i o niczym.' },
      { id: 'kawiarnia', name: 'Kawiarnia', mapX: 25, mapY: 15, unlocked: false, collected: false,
        title: 'Kawowe popołudnia',
        text: 'Mały stolik, dwie kawy i długie rozmowy. To właśnie w takich chwilach budowaliśmy nas.' },
      { id: 'dom', name: 'Nasz dom', mapX: 5, mapY: 3, unlocked: false, collected: false,
        title: 'Nasz dom',
        text: 'Miejsce, w którym przestaliśmy być gośćmi w życiu drugiego człowieka. Po prostu – dom.' },
      { id: 'finale', name: 'Dziś', mapX: 15, mapY: 9, unlocked: false, collected: false,
        title: '8 lat',
        text: 'I wciąż wybieram Ciebie. Codziennie. 16 listopada 2026.' }
    ];

    let hearts = 0;

    function makeTexture(scene, key, w, h, drawFn) {
      const g = scene.make.graphics({ x: 0, y: 0, add: false });
      drawFn(g);
      g.generateTexture(key, w, h);
      g.destroy();
    }

    class Boot extends Phaser.Scene {
      constructor() { super('Boot'); }
      create() { this.scene.start('Preload'); }
    }

    class Preload extends Phaser.Scene {
      constructor() { super('Preload'); }
      create() {
        makeTexture(this, 'grass', 32, 32, g => {
          g.fillStyle(0x5a9a45); g.fillRect(0, 0, 32, 32);
          g.fillStyle(0x6aad52); g.fillRect(2, 4, 4, 4); g.fillRect(18, 12, 5, 3);
          g.fillStyle(0x4a8a35); g.fillRect(10, 20, 6, 3); g.fillRect(24, 6, 3, 4);
        });
        makeTexture(this, 'path', 32, 32, g => {
          g.fillStyle(0xc9a66b); g.fillRect(0, 0, 32, 32);
          g.fillStyle(0xb8935a); g.fillRect(4, 8, 8, 3); g.fillRect(18, 18, 10, 2);
        });
        makeTexture(this, 'water', 32, 32, g => {
          g.fillStyle(0x4a9ec9); g.fillRect(0, 0, 32, 32);
          g.fillStyle(0x6ab8db); g.fillRect(4, 6, 12, 4); g.fillRect(16, 18, 10, 3);
        });
        makeTexture(this, 'tree', 48, 64, g => {
          g.fillStyle(0x5c3a1e); g.fillRect(20, 36, 8, 28);
          g.fillStyle(0x3d8a3a); g.fillCircle(24, 28, 20);
          g.fillStyle(0x4a9a45); g.fillCircle(16, 22, 12); g.fillCircle(32, 20, 11);
        });
        makeTexture(this, 'house', 96, 80, g => {
          g.fillStyle(0x8b5a3c); g.fillRect(8, 32, 80, 48);
          g.fillStyle(0xa05a3c); g.fillTriangle(0, 36, 48, 4, 96, 36);
          g.fillStyle(0x5c3a1e); g.fillRect(38, 52, 20, 28);
          g.fillStyle(0x7ec8e8); g.fillRect(16, 44, 16, 14); g.fillRect(64, 44, 16, 14);
        });
        makeTexture(this, 'player', 24, 32, g => {
          g.fillStyle(0x3d2e1e); g.fillRect(4, 22, 6, 10); g.fillRect(14, 22, 6, 10);
          g.fillStyle(0xe85a71); g.fillRect(2, 10, 20, 14);
          g.fillStyle(0xf5d0b0); g.fillRect(4, 0, 16, 14);
          g.fillStyle(0x5c3a2a); g.fillRect(3, 0, 18, 6);
          g.fillStyle(0x2a1a1a); g.fillRect(7, 5, 3, 3); g.fillRect(14, 5, 3, 3);
        });
        makeTexture(this, 'heart', 20, 18, g => {
          g.fillStyle(0xe85a71);
          g.fillCircle(6, 6, 6); g.fillCircle(14, 6, 6);
          g.fillTriangle(2, 8, 10, 18, 18, 8);
        });
        makeTexture(this, 'marker', 40, 40, g => {
          g.fillStyle(0x3d5c3a); g.fillRoundedRect(0, 0, 40, 40, 4);
          g.fillStyle(0x2a3a2a); g.fillRoundedRect(3, 3, 34, 34, 3);
        });
        this.scene.start('Title');
      }
    }

    class Title extends Phaser.Scene {
      constructor() { super('Title'); }
      create() {
        this.add.rectangle(W/2, H/2, W, H, 0x1a2a1a);
        for (let i = 0; i < 8; i++) {
          this.add.image(60 + i * 120, 80 + (i%2)*30, 'tree').setScale(0.7).setAlpha(0.6);
          this.add.image(80 + i * 110, 560, 'tree').setScale(0.8).setAlpha(0.5);
        }
        this.add.text(W/2, 180, 'NASZA MAPA\nŚWIATA', {
          fontFamily: 'Courier New', fontSize: '36px', color: '#e85a71',
          align: 'center', stroke: '#5c1a2a', strokeThickness: 6
        }).setOrigin(0.5);
        this.add.text(W/2, 290, '8 lat  •  Adam & Natalia', {
          fontFamily: 'Courier New', fontSize: '16px', color: '#f8b4c4'
        }).setOrigin(0.5);
        this.add.text(W/2, 330, '16 listopada 2026', {
          fontFamily: 'Courier New', fontSize: '14px', color: '#a8b89a'
        }).setOrigin(0.5);
        this.add.text(W/2, 400, 'Od wejścia do szkoły przy Solarza 12\naż do dziś...', {
          fontFamily: 'Courier New', fontSize: '13px', color: '#d0c8b0', align: 'center'
        }).setOrigin(0.5);

        const btn = this.add.rectangle(W/2, 500, 260, 50, 0xe85a71).setInteractive({ useHandCursor: true });
        this.add.text(W/2, 500, 'ZACZNIJ PODRÓŻ', {
          fontFamily: 'Courier New', fontSize: '16px', color: '#1a0a0a'
        }).setOrigin(0.5);
        btn.on('pointerdown', () => this.scene.start('World'));
        btn.on('pointerover', () => btn.setFillStyle(0xff7a91));
        btn.on('pointerout', () => btn.setFillStyle(0xe85a71));
      }
    }

    class World extends Phaser.Scene {
      constructor() { super('World'); }
      create() {
        for (let y = 0; y < H/TILE + 1; y++) {
          for (let x = 0; x < W/TILE + 1; x++) {
            this.add.image(x * TILE + 16, y * TILE + 16, 'grass');
          }
        }
        const pathPts = [
          [4,8],[6,7],[8,6],[10,5],[12,4],[14,5],[16,6],[18,7],[20,6],[22,6],
          [12,4],[11,7],[10,10],[9,12],[9,14],[12,13],[15,12],[18,12],[21,13],[25,15],
          [4,8],[4,5],[5,3]
        ];
        pathPts.forEach(([tx,ty]) => {
          this.add.image(tx * TILE + 16, ty * TILE + 16, 'path');
        });

        for (let y = 16; y < 19; y++) for (let x = 14; x < 19; x++) {
          this.add.image(x * TILE + 16, y * TILE + 16, 'water');
        }

        const trees = [[1,2],[2,15],[7,1],[26,2],[28,12],[3,18],[27,17],[20,1],[15,18]];
        trees.forEach(([tx,ty]) => this.add.image(tx*TILE+16, ty*TILE+8, 'tree').setDepth(ty));

        LOCATIONS.forEach(loc => {
          const mx = loc.mapX * TILE + 16;
          const my = loc.mapY * TILE + 16;
          const marker = this.add.image(mx, my, 'marker').setDepth(10).setInteractive({ useHandCursor: true });
          const label = this.add.text(mx, my - 28, loc.name, {
            fontFamily: 'Courier New', fontSize: '11px', color: '#f5f0e6',
            backgroundColor: '#2a3a2a', padding: { x: 4, y: 2 }
          }).setOrigin(0.5).setDepth(11);

          if (!loc.unlocked) {
            marker.setAlpha(0.35);
            label.setText('???').setAlpha(0.5);
          } else if (!loc.collected) {
            const heart = this.add.image(mx, my + 2, 'heart').setDepth(12).setScale(0.9);
            this.tweens.add({ targets: heart, y: my - 4, duration: 800, yoyo: true, repeat: -1, ease: 'Sine.easeInOut' });
          } else {
            this.add.image(mx, my + 2, 'heart').setDepth(12).setTint(0xf8b4c4);
          }

          marker.on('pointerdown', () => {
            if (loc.unlocked) this.enterLocation(loc);
          });
        });

        this.player = this.add.image(15 * TILE, 10 * TILE, 'player').setDepth(20);
        this.cursors = this.input.keyboard.createCursorKeys();
        this.wasd = this.input.keyboard.addKeys('W,A,S,D,E,I,ESC');

        this.heartsText = this.add.text(20, 16, '♥ 0 / 8', {
          fontFamily: 'Courier New', fontSize: '16px', color: '#e85a71',
          backgroundColor: '#1a2a1a', padding: { x: 8, y: 4 }
        }).setDepth(50).setScrollFactor(0);
        this.add.text(W - 20, 16, 'ADAM & NATALIA', {
          fontFamily: 'Courier New', fontSize: '12px', color: '#a8b89a'
        }).setOrigin(1, 0).setDepth(50).setScrollFactor(0);

        this.add.text(W/2, H - 18, 'Strzałki/WASD – ruch   |   Kliknij lokalizację lub E   |   I – album', {
          fontFamily: 'Courier New', fontSize: '11px', color: '#7a8a6a'
        }).setOrigin(0.5).setDepth(50).setScrollFactor(0);

        this.dlgBg = this.add.rectangle(W/2, H - 100, 700, 110, 0x2a3a2a, 0.95)
          .setStrokeStyle(3, 0xe85a71).setDepth(40).setVisible(false).setScrollFactor(0);
        this.dlgTitle = this.add.text(W/2 - 330, H - 140, '', {
          fontFamily: 'Courier New', fontSize: '14px', color: '#f8b4c4'
        }).setDepth(41).setVisible(false).setScrollFactor(0);
        this.dlgText = this.add.text(W/2 - 330, H - 115, '', {
          fontFamily: 'Courier New', fontSize: '13px', color: '#f5f0e6', wordWrap: { width: 660 }
        }).setDepth(41).setVisible(false).setScrollFactor(0);

        this.cameras.main.setBounds(0, 0, W, H);
      }

      update() {
        const spd = 2.8;
        let dx = 0, dy = 0;
        if (this.cursors.left.isDown || this.wasd.A.isDown) dx = -spd;
        if (this.cursors.right.isDown || this.wasd.D.isDown) dx = spd;
        if (this.cursors.up.isDown || this.wasd.W.isDown) dy = -spd;
        if (this.cursors.down.isDown || this.wasd.S.isDown) dy = spd;
        this.player.x = Phaser.Math.Clamp(this.player.x + dx, 20, W - 20);
        this.player.y = Phaser.Math.Clamp(this.player.y + dy, 20, H - 20);

        if (Phaser.Input.Keyboard.JustDown(this.wasd.E)) {
          LOCATIONS.forEach(loc => {
            if (!loc.unlocked) return;
            const mx = loc.mapX * TILE + 16;
            const my = loc.mapY * TILE + 16;
            if (Phaser.Math.Distance.Between(this.player.x, this.player.y, mx, my) < 50) {
              this.enterLocation(loc);
            }
          });
        }
      }

      enterLocation(loc) {
        this.dlgTitle.setText(loc.title).setVisible(true);
        let txt = loc.text;
        if (!loc.collected && loc.id !== 'finale') {
          txt += '\n\n[Naciśnij E, aby zebrać fragment serca]';
        }
        this.dlgText.setText(txt).setVisible(true);
        this.dlgBg.setVisible(true);

        this.input.keyboard.once('keydown-E', () => {
          if (!loc.collected && loc.id !== 'finale') {
            loc.collected = true;
            hearts++;
            this.heartsText.setText('♥ ' + hearts + ' / 8');
            if (hearts >= 2) LOCATIONS.find(l => l.id === 'park').unlocked = true;
            if (hearts >= 3) LOCATIONS.find(l => l.id === 'kawiarnia').unlocked = true;
            if (hearts >= 4) LOCATIONS.find(l => l.id === 'dom').unlocked = true;
            if (hearts >= 7) LOCATIONS.find(l => l.id === 'finale').unlocked = true;

            this.time.delayedCall(800, () => {
              this.dlgBg.setVisible(false);
              this.dlgTitle.setVisible(false);
              this.dlgText.setVisible(false);
              if (hearts >= 8) {
                this.scene.start('Ending');
              } else {
                this.scene.restart();
              }
            });
          } else {
            this.dlgBg.setVisible(false);
            this.dlgTitle.setVisible(false);
            this.dlgText.setVisible(false);
          }
        });
      }
    }

    class Ending extends Phaser.Scene {
      constructor() { super('Ending'); }
      create() {
        this.add.rectangle(W/2, H/2, W, H, 0x1a2a1a);
        this.add.text(W/2, 160, '8 LAT', {
          fontFamily: 'Courier New', fontSize: '42px', color: '#e85a71',
          stroke: '#5c1a2a', strokeThickness: 6
        }).setOrigin(0.5);
        this.add.text(W/2, 250, 'Zebrałaś wszystkie fragmenty serca.', {
          fontFamily: 'Courier New', fontSize: '16px', color: '#f5f0e6'
        }).setOrigin(0.5);
        this.add.text(W/2, 310, 'Od pierwszego spojrzenia\nprzy szkole na Solarza\naż do tej chwili…', {
          fontFamily: 'Courier New', fontSize: '15px', color: '#d0c8b0', align: 'center'
        }).setOrigin(0.5);
        this.add.text(W/2, 420, 'Kocham Cię, Natalia.\nHappy 8th Anniversary.', {
          fontFamily: 'Courier New', fontSize: '18px', color: '#f8b4c4', align: 'center'
        }).setOrigin(0.5);
        this.add.text(W/2, 520, '16.11.2026  •  Adam', {
          fontFamily: 'Courier New', fontSize: '14px', color: '#a8b89a'
        }).setOrigin(0.5);

        const btn = this.add.rectangle(W/2, 580, 220, 40, 0xe85a71).setInteractive({ useHandCursor: true });
        this.add.text(W/2, 580, 'ZAGRAJ PONOWNIE', { fontFamily: 'Courier New', fontSize: '14px', color: '#1a0a0a' }).setOrigin(0.5);
        btn.on('pointerdown', () => {
          hearts = 0;
          LOCATIONS.forEach(l => { l.collected = false; if (['park','kawiarnia','dom','finale'].includes(l.id)) l.unlocked = false; });
          this.scene.start('Title');
        });
      }
    }

    new Phaser.Game({
      type: Phaser.AUTO,
      width: W,
      height: H,
      parent: 'game-container',
      backgroundColor: '#1a2a1a',
      pixelArt: true,
      scene: [Boot, Preload, Title, World, Ending]
    });
  </script>
</body>
</html>
